syntax = "proto3";

package raftkv.v1;

option go_package = "github.com/abeer/raft-kv/proto/raftkv/v1";

// LogEntry represents a single entry in the Raft log
message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes data = 3;
}

// RequestVoteRequest is sent by candidates to gather votes
message RequestVoteRequest {
  uint64 term = 1;
  int32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

// RequestVoteResponse is the reply to RequestVoteRequest
message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

// AppendEntriesRequest is sent by leader to replicate log entries
message AppendEntriesRequest {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

// AppendEntriesResponse is the reply to AppendEntriesRequest
message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
}

// InstallSnapshotRequest is sent by leader to stream state machine snapshots
message InstallSnapshotRequest {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
  bool done = 6;
}

// InstallSnapshotResponse is the reply to InstallSnapshotRequest
message InstallSnapshotResponse {
  uint64 term = 1;
}

// ClientRequest represents a key-value operation sent to the cluster
message ClientRequest {
  string op = 1; // "SET", "GET", "DELETE"
  string key = 2;
  string value = 3;
}

// ClientResponse is sent back to the client after operation completion
message ClientResponse {
  bool success = 1;
  string value = 2;
  string error = 3;
  string leader_addr = 4;
}

// RaftService provides internal consensus RPCs between Raft nodes
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// KVService provides public Key-Value API for clients
service KVService {
  rpc Execute(ClientRequest) returns (ClientResponse);
}
